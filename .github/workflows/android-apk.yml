name: Build downloadable Android APK
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the tested APK from a completed build run
        type: boolean
        default: false
      verify_update:
        description: Verify the in-app upgrade after the website update feed is deployed
        type: boolean
        default: true
      artifact_run_id:
        description: Earlier successful build run ID (required to publish, optional to recheck)
        type: string
        default: ''
      reviewed_sha:
        description: Full reviewed main commit SHA (required to sign or publish)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  apk:
    if: github.event_name == 'workflow_dispatch' && !inputs.publish_release && inputs.artifact_run_id == '' && github.ref == 'refs/heads/main'
    environment: android-signing
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      NODE_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      ANDROID_KEYSTORE_PATH: /tmp/serbisyogo-release.p12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the reviewed commit and signing approval
        run: node ../.github/scripts/check-release.mjs approval android-signing
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            mobile/package-lock.json
            mobile/app.json
            mobile/scripts/prepare-android-release.mjs
      - name: Install the locked mobile dependencies
        run: npm ci --include=dev
      - run: npm test
      - run: npm run lint
      - run: npx expo install --check
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Configure persistent private release signing
        run: node scripts/prepare-android-release.mjs
        env:
          ANDROID_RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          ANDROID_RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_ALIAS }}
      - name: Build the standalone release APK
        working-directory: mobile/android
        run: node ../../scripts/report-ci-command.mjs ./gradlew :app:assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64
        env:
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          ANDROID_RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_ALIAS }}
      - name: Verify signing, identity, permissions and bundled code
        run: node scripts/verify-apk.mjs
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      - name: Build an isolated lower-version updater fixture
        run: node scripts/build-update-baseline.mjs
        env:
          ANDROID_RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
          ANDROID_RELEASE_ALIAS: ${{ secrets.ANDROID_RELEASE_ALIAS }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      - name: Keep the signed APK for independent native checks
        uses: actions/upload-artifact@v7
        with:
          name: SerbisyoGo-signed-APK
          path: mobile/builds/*
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner signing material
        if: always()
        run: node -e "require('fs').rmSync(process.env.ANDROID_KEYSTORE_PATH, {force:true})"
  native-checks:
    needs: apk
    if: ${{ !cancelled() && !inputs.publish_release && (needs.apk.result == 'success' || inputs.artifact_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: '1'
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve the already verified signed APK
        run: |
          if [[ "$ARTIFACT_RUN" != "$GITHUB_RUN_ID" ]]; then
            node ../.github/scripts/check-release.mjs android-run
          fi
          gh run download "$ARTIFACT_RUN" --name SerbisyoGo-signed-APK --dir builds
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id || github.run_id }}
      - name: Recheck downloaded APK identity and signature
        run: node scripts/verify-downloaded-apk.mjs
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      - name: Start an Android emulator for installation checks
        timeout-minutes: 12
        run: bash ../.github/scripts/start-android-emulator.sh
      - name: Install APK and check native navigation without Metro
        timeout-minutes: 6
        run: node scripts/smoke-android.mjs
      - name: Keep the verified APK and evidence
        uses: actions/upload-artifact@v7
        with:
          name: SerbisyoGo-Android-APK
          path: mobile/builds/*
          if-no-files-found: error
          retention-days: 30
      - name: Show native failure diagnostics
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/android-emulator.log" ]; then tail -n 50 "$RUNNER_TEMP/android-emulator.log"; fi
          timeout 10 adb -e logcat -d -b crash || true
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main'
    environment: android-production
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: mobile
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify approval and the source build run
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_SHA: ${{ inputs.reviewed_sha }}
          ARTIFACT_RUN: ${{ inputs.artifact_run_id }}
        run: |
          node ../.github/scripts/check-release.mjs approval android-production
          node ../.github/scripts/check-release.mjs android-run
          gh run download "$ARTIFACT_RUN" --name SerbisyoGo-Android-APK --dir builds
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Recheck the tested APK before publication
        run: node scripts/verify-downloaded-apk.mjs
        env:
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
      - name: Publish the approved artifact
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Start the updater test emulator
        if: inputs.verify_update
        timeout-minutes: 12
        run: bash ../.github/scripts/start-android-emulator.sh
      - name: Verify the real in-app Android update flow
        if: inputs.verify_update
        timeout-minutes: 12
        run: node scripts/smoke-update.mjs
      - name: Publish in-app update verification evidence
        if: inputs.verify_update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('app.json')).expo.version")
          gh release upload "android-v$version" builds/build-metadata.json builds/android-update-ready.png builds/android-update-confirmation.png --clobber
      - name: Keep updater verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: SerbisyoGo-updater-evidence
          path: |
            mobile/builds/android-update-*.png
            mobile/builds/update-failure.xml
            mobile/builds/build-metadata.json
