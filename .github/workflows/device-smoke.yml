name: Physical device smoke test
on:
  workflow_dispatch:
    inputs:
      apk_path:
        description: Path to APK file on the runner
        required: false
        default: ''
permissions:
  contents: read
jobs:
  smoke:
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify ADB and device
        run: |
          adb version
          adb devices -l
      - name: Run smoke test
        run: node scripts/physical-device-smoke.mjs ${{ inputs.apk_path }}
        env:
          TEST_APK_PATH: ${{ inputs.apk_path }}
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-smoke-report
          path: |
            .cache/device-test-report.json
            .cache/device-test-report/
          retention-days: 30
