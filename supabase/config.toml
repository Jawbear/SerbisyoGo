project_id = "serbisyogo"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 15
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback/"]
enable_signup = true
minimum_password_length = 8
[auth.email]
enable_signup = true
enable_confirmations = true
subjects_confirmation = "Verify your SerbisyoGo account"
subjects_recovery = "Reset your SerbisyoGo password"
subjects_email_change = "Confirm your email change — SerbisyoGo"

[auth.email.template.confirmation]
subject = "Verify your SerbisyoGo account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your SerbisyoGo password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your email change — SerbisyoGo"
content_path = "./supabase/templates/email_change.html"

# Production SMTP — configure in Supabase Dashboard > Auth > Email Templates > SMTP Settings
# For local testing, Supabase uses Inbucket at http://localhost:54324
# Example for Resend (recommended):
#   SMTP Host: smtp.resend.com
#   SMTP Port: 465
#   SMTP User: resend
#   SMTP Pass: re_YOUR_API_KEY
#   Sender: noreply@serbisyogo.ph
[storage]
enabled = true
file_size_limit = "64MiB"
[functions.files]
verify_jwt = false
[functions.releases]
verify_jwt = false
[functions.admin-accounts]
verify_jwt = false
